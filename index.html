<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <title>Groupify</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header class="container">

      <!-- Navigation elements -->
      <nav>
        <ul>
          <li><h2>Groupify</h2></li>
        </ul>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="event.html">Create Event</a></li>
          <li><a href="checkin.html">Join Event</a></li>
          <li><a href="waiting.html">Waiting</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main class="container">
      <h1>Welcome to Groupify</h1>
      <form method="get" action="create.html">
          <fieldset>
              <!-- Input inside label -->
              <label for="username">Username</label>
                <input
                  name="username"
                  placeholder="Username"
                  autocomplete="given-name"
                />

              <!-- Input outside label -->
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="password"
              />
          </fieldset>
        <input type="submit" value="Login"/>
      </form>
    </main>

    <footer>
      <hr />
      <span class="text-reset">Connor Robb</span>
      <br />
      <a href="https://github.com/SecretJuice/startup">GitHub</a>
    </footer>
  </body>
</html>
