<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tell browsers not to scale the viewport automatically -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
    <title>Groupify</title>
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- Use header, main, and footer elements to give semantic structure -->
    <header class="container">

      <!-- Navigation elements -->
      <nav>
        <ul>
          <li><a href="index.html"><h2>Groupify</h2></a></li>
        </ul>
        <!-- Menu is a semantic alternative to <ul> that represents an interaction -->
        <ul>
          <li><a href="event.html">Create Event</a></li>
          <li><a href="checkin.html">Join Event</a></li>
          <li><a href="waiting.html">Waiting</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>

      <!-- Since we don't have the ability to style we use old style HTML to give some visual formatting -->
      <hr />
    </header>

    <main>
      <h2>Stake Activity</h2>
      <div><h3>Group A</h3><span>27</span><button>Call</button></div>
      <div>
          <h3>Group B</h3><span>3</span><button>Call</button>
          <ul>
              <li>Maria</li>
              <li>Todd</li>
              <li>Frank</li>
          </ul>
      </div>
      <div><h3>Group C</h3><span>53</span><button>Call</button></div>
      <div><h3>Group D</h3><span>44</span><button disabled>Called</button></div>
      <form>
          <input type="text" placeholder='option 1'/>
          <input type="checkbox"/>
          <input type=submit>Change Settings</input>
      </form>
      <span>Group Code: 1234</span>
      <img src="qrcode.png" alt="QR Code">
    </main>

    <footer class="container">
      <hr/>
      <nav>
          <ul>
              <li>Created by: Connor Robb</li>
          </ul>
          <ul>
              <li>
                  <a href="https://github.com/SecretJuice/startup">GitHub</a>
              </li>
          </ul>
      </nav>
    </footer>
  </body>
</html>
